name: Build unsigned Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-unsigned-apk.yml'

permissions:
  contents: read

jobs:
  build-unsigned-apk:
    name: Validate and build unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build unsigned release APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://caller-flutter.onrender.com

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: caller-monitor-unsigned-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
